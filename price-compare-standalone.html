<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mannatech GLG — 나라별 가격 비교</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%232d6a4f'/><circle cx='16' cy='16' r='7' fill='%2374c69d'/></svg>">
<!-- 구글 폰트 제거: 시스템 폰트 사용 (오프라인 지원) -->
<style>
/* ─── CSS RESET & BASE ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green-dark:   #2d6a4f;
  --green-mid:    #40916c;
  --green-light:  #74c69d;
  --cream:        #fdf6ec;
  --sage-pale:    #eaf4e8;
  --sky-pale:     #deeef9;
  --lavender:     #edeaf8;
  --peach-pale:   #fde8d8;
  --off-white:    #fafaf8;
  --text-dark:    #1a2e1a;
  --text-mid:     #3a5a3a;
  --text-muted:   #7a9a7a;
  --border:       #d4e6d4;
  --shadow-sm:    0 2px 8px rgba(45,106,79,.08);
  --shadow-md:    0 4px 20px rgba(45,106,79,.13);
  --shadow-lg:    0 8px 40px rgba(45,106,79,.18);
  --radius-sm:    8px;
  --radius-md:    14px;
  --radius-lg:    22px;
  --radius-xl:    36px;

  /* Country accent colours */
  --kr:  #e8534a; /* Korea red */
  --us:  #3a5aac; /* USA blue */
  --jp:  #c0392b; /* Japan red */
  --cn:  #d4a017; /* China gold */
  --au:  #2e7d32; /* Australia green */
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','나눔고딕','Noto Sans KR',sans-serif;
  background: var(--off-white);
  color: var(--text-dark);
  min-height: 100vh;
}

/* ─── TOPBAR ─────────────────────────────────────────────── */
.topbar {
  background: var(--green-dark);
  color: #fff;
  padding: 0 24px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.18);
}
.topbar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -.3px;
  text-decoration: none;
  color: #fff;
}
.topbar-logo span { color: var(--green-light); }
.topbar-back {
  font-size: .85rem;
  color: rgba(255,255,255,.82);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 20px;
  transition: all .2s;
}
.topbar-back:hover { background: rgba(255,255,255,.12); color: #fff; }

/* ─── HERO STRIP ─────────────────────────────────────────── */
.page-hero {
  background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
  color: #fff;
  padding: 44px 24px 36px;
  text-align: center;
}
.page-hero h1 {
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 700;
  letter-spacing: -.5px;
}
.page-hero p {
  margin-top: 10px;
  font-size: .96rem;
  opacity: .82;
}
.exchange-bar {
  margin-top: 22px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 30px;
  padding: 8px 20px;
  font-size: .82rem;
  flex-wrap: wrap;
  justify-content: center;
}
.exchange-bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-light); display: inline-block; }
.rate-badge {
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 600;
  font-size: .78rem;
}
.rate-live { background: rgba(116,198,157,.3); color: #b4fbd3; }
.rate-loading { background: rgba(255,255,255,.15); color: rgba(255,255,255,.7); }
#refresh-rates {
  background: none;
  border: 1px solid rgba(255,255,255,.35);
  color: rgba(255,255,255,.85);
  padding: 4px 12px;
  border-radius: 14px;
  cursor: pointer;
  font-size: .78rem;
  transition: all .2s;
}
#refresh-rates:hover { background: rgba(255,255,255,.15); color: #fff; }

/* ─── MAIN LAYOUT ─────────────────────────────────────────── */
.main-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 16px 80px;
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 24px;
  align-items: start;
}
@media (max-width: 1100px) { .main-wrap { grid-template-columns: 1fr; } }

/* ─── COUNTRY TABS ────────────────────────────────────────── */
.tabs-wrap {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.tab-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 20px;
  border-radius: 30px;
  border: 2px solid transparent;
  background: #fff;
  cursor: pointer;
  font-size: .88rem;
  font-weight: 600;
  transition: all .22s;
  box-shadow: var(--shadow-sm);
  color: var(--text-mid);
}
.tab-btn .flag { font-size: 1.2rem; }
.tab-btn:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.tab-btn.active { color: #fff; border-color: transparent; }
.tab-btn[data-country="KR"].active { background: var(--kr); }
.tab-btn[data-country="US"].active { background: var(--us); }
.tab-btn[data-country="JP"].active { background: var(--jp); }
.tab-btn[data-country="CN"].active { background: var(--cn); }
.tab-btn[data-country="AU"].active { background: var(--au); }
.tab-btn[data-country="ALL"].active { background: var(--green-dark); }
.tab-btn .cart-count-badge {
  min-width: 18px; height: 18px;
  border-radius: 9px;
  background: rgba(255,255,255,.35);
  font-size: .7rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}
.tab-btn.active .cart-count-badge { background: rgba(255,255,255,.3); color: #fff; }

/* ─── VIEW TOGGLE ─────────────────────────────────────────── */
.view-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.view-controls label { font-size: .85rem; color: var(--text-muted); font-weight: 500; }
.view-toggle-btn {
  padding: 5px 14px;
  border-radius: 18px;
  border: 1px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-size: .82rem;
  color: var(--text-mid);
  transition: all .18s;
}
.view-toggle-btn.active {
  background: var(--green-dark);
  color: #fff;
  border-color: var(--green-dark);
}
.search-box {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  box-shadow: var(--shadow-sm);
}
.search-box input {
  border: none;
  outline: none;
  font-size: .85rem;
  width: 180px;
  background: transparent;
  color: var(--text-dark);
}
.search-box svg { color: var(--text-muted); flex-shrink: 0; }

/* ─── PRODUCT GRID VIEW ───────────────────────────────────── */
#grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.product-card {
  background: #fff;
  border-radius: var(--radius-md);
  padding: 18px 16px 14px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--border);
  transition: all .22s;
  position: relative;
  display: flex;
  flex-direction: column;
}
.product-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.product-card-country {
  font-size: .72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
  margin-bottom: 8px;
  letter-spacing: .3px;
}
.country-KR .product-card-country { background: #fde8e7; color: var(--kr); }
.country-US .product-card-country { background: #e7ecf8; color: var(--us); }
.country-JP .product-card-country { background: #fde8e7; color: var(--jp); }
.country-CN .product-card-country { background: #fdf3d7; color: var(--cn); }
.country-AU .product-card-country { background: #e8f5e9; color: var(--au); }
.product-card-name {
  font-size: .9rem;
  font-weight: 600;
  color: var(--text-dark);
  line-height: 1.35;
  flex: 1;
  margin-bottom: 10px;
}
.product-card-name-sub {
  font-size: .78rem;
  color: var(--text-muted);
  margin-top: 3px;
  line-height: 1.3;
}
.product-card-price-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 10px;
}
.product-card-price {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--green-dark);
}
.product-card-pv {
  font-size: .78rem;
  color: var(--text-muted);
  background: var(--sage-pale);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.product-card-pv span { color: var(--green-mid); }
/* ─── CARD QUANTITY STEPPER ─────────────────────────────── */
.card-cart-area {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
/* Initial state: single wide "+ 담기" button */
.card-add-btn {
  width: 100%;
  padding: 8px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--sage-pale);
  color: var(--green-dark);
  font-size: .83rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.card-add-btn:hover { background: var(--green-dark); color: #fff; }
/* Qty stepper row – shown when qty > 0 */
.card-stepper {
  display: none;           /* shown via JS */
  align-items: center;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1.5px solid var(--green-mid);
  height: 34px;
}
.card-stepper.visible { display: flex; }
.cs-btn {
  flex: 0 0 34px;
  height: 100%;
  border: none;
  background: var(--green-dark);
  color: #fff;
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  transition: background .15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cs-btn:hover { background: var(--green-mid); }
.cs-num {
  flex: 1;
  text-align: center;
  font-size: .92rem;
  font-weight: 700;
  color: var(--green-dark);
  background: #fff;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  user-select: none;
}
/* subtotal line inside card */
.card-subtotal {
  display: none;
  font-size: .78rem;
  font-weight: 600;
  color: var(--green-mid);
  text-align: right;
  padding-right: 2px;
}
.card-subtotal.visible { display: block; }

/* compare-table inline stepper */
.tbl-stepper {
  display: inline-flex;
  align-items: center;
  border: 1.5px solid var(--green-mid);
  border-radius: 8px;
  overflow: hidden;
  margin-top: 5px;
  height: 28px;
}
.ts-btn {
  width: 26px; height: 100%;
  border: none;
  background: var(--green-dark);
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
.ts-btn:hover { background: var(--green-mid); }
.ts-num {
  min-width: 24px;
  text-align: center;
  font-size: .82rem;
  font-weight: 700;
  color: var(--green-dark);
  background: #fff;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  user-select: none;
}
.ts-add-btn {
  display: block;
  margin-top: 5px;
  padding: 3px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--green-mid);
  background: #fff;
  color: var(--green-mid);
  font-size: .75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
}
.ts-add-btn:hover { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }

/* ─── COMPARISON TABLE ────────────────────────────────────── */
#compare-view { display: none; }
.compare-table-wrap { overflow-x: auto; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.compare-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  min-width: 780px;
}
.compare-table th {
  padding: 12px 14px;
  text-align: center;
  font-size: .82rem;
  font-weight: 700;
  letter-spacing: .2px;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.compare-table th.name-col { text-align: left; min-width: 220px; background: var(--sage-pale); }
.compare-table th.kr-col { background: #fde8e7; color: var(--kr); }
.compare-table th.us-col { background: #e7ecf8; color: var(--us); }
.compare-table th.jp-col { background: #fde8e7; color: var(--jp); }
.compare-table th.cn-col { background: #fdf3d7; color: var(--cn); }
.compare-table th.au-col { background: #e8f5e9; color: var(--au); }
.compare-table td {
  padding: 10px 14px;
  border-bottom: 1px solid #f0f4f0;
  font-size: .85rem;
  vertical-align: middle;
}
.compare-table td.name-col {
  font-weight: 600;
  color: var(--text-dark);
  background: var(--off-white);
}
.compare-table td.price-cell { text-align: center; white-space: nowrap; }
.compare-table td.empty-cell { text-align: center; color: #ccc; font-size: 1rem; }
.compare-table tr:hover td { background: #f7fdf7; }
.compare-table tr:hover td.name-col { background: var(--sage-pale); }
.price-main { font-weight: 700; color: var(--green-dark); display: block; }
.price-pv { font-size: .72rem; color: var(--text-muted); margin-top: 2px; display: block; }
.price-converted { font-size: .73rem; color: var(--green-mid); margin-top: 1px; display: block; }
.best-price { background: #e8f5e9 !important; }
.best-price .price-main { color: var(--au); }

/* ─── CART PANEL ──────────────────────────────────────────── */
.cart-panel {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  border: 1.5px solid var(--border);
  position: sticky;
  top: 78px;
  overflow: hidden;
}
.cart-header {
  background: var(--green-dark);
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cart-header h2 { font-size: 1rem; font-weight: 700; }
.cart-header-badge {
  background: rgba(255,255,255,.2);
  border-radius: 12px;
  padding: 2px 10px;
  font-size: .8rem;
}
.cart-country-tabs {
  display: flex;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
}
.cart-country-tab {
  flex: 1;
  min-width: 52px;
  padding: 8px 4px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: .75rem;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 3px solid transparent;
  transition: all .18s;
  white-space: nowrap;
  text-align: center;
}
.cart-country-tab.active { color: var(--green-dark); border-bottom-color: var(--green-dark); }
.cart-country-tab .tab-flag { font-size: 1rem; display: block; }
.cart-body { padding: 0; }
.cart-country-panel { display: none; }
.cart-country-panel.active { display: block; }
.cart-items {
  max-height: 340px;
  overflow-y: auto;
  padding: 8px 0;
}
.cart-items:empty::after {
  content: '담긴 제품이 없습니다';
  display: block;
  text-align: center;
  padding: 32px 16px;
  color: var(--text-muted);
  font-size: .85rem;
}
.cart-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border-bottom: 1px solid #f5f5f5;
  transition: background .15s;
}
.cart-item:hover { background: var(--sage-pale); }
.cart-item-name {
  flex: 1;
  font-size: .82rem;
  font-weight: 500;
  color: var(--text-dark);
  line-height: 1.3;
}
.cart-qty-ctrl {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.qty-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .85rem;
  line-height: 1;
  transition: all .15s;
  color: var(--text-mid);
}
.qty-btn:hover { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }
.qty-num { font-size: .82rem; font-weight: 700; min-width: 18px; text-align: center; color: var(--text-dark); }
.cart-item-price {
  font-size: .82rem;
  font-weight: 700;
  color: var(--green-dark);
  min-width: 70px;
  text-align: right;
  flex-shrink: 0;
}
.cart-item-remove {
  border: none; background: none; cursor: pointer; color: #ccc;
  font-size: .9rem; padding: 2px 4px; transition: color .15s;
}
.cart-item-remove:hover { color: #e74c3c; }

.cart-totals {
  border-top: 2px solid var(--border);
  padding: 14px 16px;
  background: var(--sage-pale);
}
.cart-total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: .86rem;
}
.cart-total-row.main { font-size: 1rem; font-weight: 700; color: var(--green-dark); padding-top: 8px; margin-top: 4px; border-top: 1px solid var(--border); }
.cart-total-row.krw-converted { font-size: .78rem; color: var(--text-muted); }
.cart-total-row.pv-total { color: var(--green-mid); font-weight: 600; }
.cart-clear-btn {
  margin: 12px 16px;
  width: calc(100% - 32px);
  padding: 9px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-size: .82rem;
  color: #e74c3c;
  font-weight: 600;
  transition: all .18s;
}
.cart-clear-btn:hover { background: #e74c3c; color: #fff; border-color: #e74c3c; }

/* ─── LOADING / ERROR STATES ──────────────────────────────── */
.loading-overlay {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--green-mid);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── CATEGORY CHIPS ──────────────────────────────────────── */
.category-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.cat-chip {
  padding: 4px 14px;
  border-radius: 18px;
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-size: .8rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: all .18s;
}
.cat-chip.active { background: var(--green-mid); color: #fff; border-color: var(--green-mid); }
.cat-chip:hover:not(.active) { border-color: var(--green-mid); color: var(--green-mid); }

/* ─── FLOATING CART SUMMARY ───────────────────────────────── */
.float-cart-btn {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 20px;
  background: var(--green-dark);
  color: #fff;
  border: none;
  border-radius: 28px;
  padding: 12px 22px;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(45,106,79,.35);
  z-index: 90;
  align-items: center;
  gap: 10px;
  transition: all .22s;
}
.float-cart-btn:hover { background: var(--green-mid); transform: translateY(-2px); }
@media (max-width: 1100px) { .float-cart-btn { display: flex; } }

/* ─── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 768px) {
  .main-wrap { padding: 16px 12px 80px; gap: 16px; }
  #grid-view { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .product-card { padding: 14px 12px 12px; }
  .search-box input { width: 120px; }
  .compare-table th, .compare-table td { padding: 8px 10px; }
}
@media (max-width: 480px) {
  #grid-view { grid-template-columns: 1fr 1fr; }
  .tabs-wrap { gap: 4px; }
  .tab-btn { padding: 7px 12px; font-size: .8rem; }
}

/* ─── MISC ────────────────────────────────────────────────── */
.section-label {
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);

function buildProducts(raw) {
  PRODUCTS = [];

  // Korea: name_ko only → use as display
  raw.korea.forEach((p, i) => {
    PRODUCTS.push({
      id: `KR-${i}`,
      country: 'KR',
      name: p.name_ko,
      name_display: p.name_ko,
      name_sub: '',
      price: p.price,
      pv: p.pv,
      category: '영양 & 건강',
      match_key: normalizeForMatch(p.name_ko)
    });
  });

  // USA
  raw.usa.forEach((p, i) => {
    PRODUCTS.push({
      id: `US-${p.item_no}`,
      country: 'US',
      item_no: p.item_no,
      name: cleanName(p.name_en),
      name_display: cleanName(p.name_en),
      name_sub: '',
      price: p.price,
      pv: p.pv,
      category: p.category || 'NUTRITION',
      match_key: normalizeForMatch(p.name_en)
    });
  });

  // Japan
  raw.japan.forEach((p, i) => {
    PRODUCTS.push({
      id: `JP-${p.item_no}`,
      country: 'JP',
      item_no: p.item_no,
      name: p.name_en,
      name_display: p.name_en,
      name_sub: p.name_ja || '',
      price: p.price,
      pv: p.pv,
      category: '영양',
      match_key: normalizeForMatch(p.name_en)
    });
  });

  // China
  raw.china.forEach((p, i) => {
    PRODUCTS.push({
      id: `CN-${p.item_no}`,
      country: 'CN',
      item_no: p.item_no,
      name: p.name_en || p.name_cn,
      name_display: p.name_cn,
      name_sub: p.name_en && p.name_en !== p.name_cn ? p.name_en : '',
      price: p.price,
      pv: p.pv,
      category: '营养',
      match_key: normalizeForMatch(p.name_en || p.name_cn)
    });
  });

  // Australia
  raw.australia.forEach((p, i) => {
    PRODUCTS.push({
      id: `AU-${p.item_no}`,
      country: 'AU',
      item_no: p.item_no,
      name: p.name_en,
      name_display: p.name_en,
      name_sub: '',
      price: p.price,
      pv: p.pv,
      category: 'Health & Wellness',
      match_key: normalizeForMatch(p.name_en)
    });
  });

  renderAll();
}

function normalizeForMatch(s) {
  if (!s) return '';
  return s.toLowerCase()
    .replace(/[®™©]/g, '')
    .replace(/\(.*?\)/g, '')
    .replace(/[^a-z0-9가-힣]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function cleanName(s) {
  return s.replace(/\s{2,}/g, ' ').trim();
}

// ─────────────────────────────────────────────────────────
// EXCHANGE RATE FETCH
// ─────────────────────────────────────────────────────────
async function fetchRates() {
  document.querySelectorAll('.rate-badge').forEach(b => {
    b.className = 'rate-badge rate-loading';
  });
  try {
    // open.er-api.com supports CORS (Access-Control-Allow-Origin: *)
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    const rates = data.rates;
    // rates: 1 USD = X [currency]
    RATES.USD = Math.round(rates.KRW);
    RATES.JPY = +(rates.KRW / rates.JPY).toFixed(2);   // 1 JPY = ? KRW
    RATES.CNY = Math.round(rates.KRW / rates.CNY);      // 1 CNY = ? KRW
    RATES.AUD = Math.round(rates.KRW / rates.AUD);      // 1 AUD = ? KRW
    updateRateBadges(true);
    // Re-render compare table for updated KRW conversions
    if (currentView === 'compare') renderCompareTable();
    renderCartPanels();
  } catch(e) {
    console.warn('Rate fetch failed, using fallback', e);
    updateRateBadges(false);
  }
}

function updateRateBadges(live) {
  const cls = live ? 'rate-badge rate-live' : 'rate-badge rate-loading';
  const label = live ? '' : '(고정)';
  document.getElementById('rate-usd').className = cls;
  document.getElementById('rate-usd').textContent = `1 USD = ₩${RATES.USD.toLocaleString()} ${label}`;
  document.getElementById('rate-jpy').className = cls;
  document.getElementById('rate-jpy').textContent = `1 JPY = ₩${RATES.JPY} ${label}`;
  document.getElementById('rate-cny').className = cls;
  document.getElementById('rate-cny').textContent = `1 CNY = ₩${RATES.CNY.toLocaleString()} ${label}`;
  document.getElementById('rate-aud').className = cls;
  document.getElementById('rate-aud').textContent = `1 AUD = ₩${RATES.AUD.toLocaleString()} ${label}`;
}

function toKRW(price, country) {
  const key = CURRENCY[country].rate_key;
  return Math.round(price * RATES[key]);
}

function formatPrice(price, country) {
  const c = CURRENCY[country];
  if (c.code === 'KRW') return `₩${Math.round(price).toLocaleString()}`;
  if (c.code === 'JPY') return `¥${Math.round(price).toLocaleString()}`;
  if (c.code === 'AUD') return `A$${price.toFixed(2)}`;
  return `$${price.toFixed(2)}`;
}

// ─────────────────────────────────────────────────────────
// RENDER: COMPARE TABLE
// ─────────────────────────────────────────────────────────
function renderCompareTable() {
  // Build unified product name list from English names
  const nameMap = {}; // normalized_key → {name, KR, US, JP, CN, AU}

  PRODUCTS.forEach(p => {
    const key = p.match_key || p.id;
    if (!nameMap[key]) nameMap[key] = { name: p.name_display, items: {} };
    if (!nameMap[key].items[p.country]) nameMap[key].items[p.country] = p;
  });

  // Sort by name
  const rows = Object.values(nameMap).sort((a, b) => a.name.localeCompare(b.name, 'ko'));

  // Filter by search
  const filtered = rows.filter(r => {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return r.name.toLowerCase().includes(q) ||
      Object.values(r.items).some(p => p.name.toLowerCase().includes(q));
  });

  const countries = ['KR', 'US', 'JP', 'CN', 'AU'];

  const tbody = document.getElementById('compare-tbody');
  tbody.innerHTML = filtered.map(row => {
    // Find min KRW price
    const prices = countries
      .filter(c => row.items[c])
      .map(c => ({ c, krw: toKRW(row.items[c].price, c) }));
    const minKrw = prices.length > 1 ? Math.min(...prices.map(p => p.krw)) : null;

    const cells = countries.map(c => {
      const p = row.items[c];
      if (!p) return `<td class="price-cell empty-cell">—</td>`;
      const krw = toKRW(p.price, c);
      const isBest = minKrw !== null && krw === minKrw;
      const cartItem = getCartItem(p.id, c);
      const tQty = cartItem ? cartItem.qty : 0;
      const stepperHtml = tQty > 0
        ? `<div class="tbl-stepper">
            <button class="ts-btn" onclick="tblQty('${p.id}','${c}',${p.price},${p.pv},-1)">−</button>
            <span class="ts-num" id="tsnum-${p.id}">${tQty}</span>
            <button class="ts-btn" onclick="tblQty('${p.id}','${c}',${p.price},${p.pv},1)">+</button>
          </div>`
        : `<button class="ts-add-btn" onclick="tblAddFirst('${p.id}','${c}',${p.price},${p.pv})">+ 담기</button>`;
      return `<td class="price-cell${isBest ? ' best-price' : ''}" id="tcell-${p.id}">
        <span class="price-main">${formatPrice(p.price, c)}</span>
        <span class="price-pv">PV ${p.pv}</span>
        ${c !== 'KR' ? `<span class="price-converted">≈ ₩${krw.toLocaleString()}</span>` : ''}
        ${isBest && prices.length > 1 ? '<span style="font-size:.65rem;color:#ff7043;font-weight:700">★ 최저가</span>' : ''}
        ${stepperHtml}
      </td>`;
    });

    return `<tr>
      <td class="name-col">${escHtml(row.name)}</td>
      ${cells.join('')}
    </tr>`;
  }).join('');
}

// ─────────────────────────────────────────────────────────
// CART LOGIC
// ─────────────────────────────────────────────────────────
function getCartItem(id, country) {
  return cart[country].find(i => i.id === id) || null;
}
function isInCart(id, country) {
  return !!getCartItem(id, country);
}

// ── Card view: first "+ 담기" click ──────────────────────
function cardAddFirst(id, country, price, pv) {
  const p = PRODUCTS.find(p => p.id === id);
  cart[country].push({ id, name: p ? p.name_display : id, price, pv, qty: 1 });
  _refreshCardUI(id, country, price, pv);
  updateCartBadges();
  renderCartPanels();
  switchCartTab(country);
}

// ── Card view: −/+ stepper ───────────────────────────────
function cardQty(id, country, price, pv, delta) {
  const item = getCartItem(id, country);
  if (!item) return;
  const newQty = item.qty + delta;
  if (newQty <= 0) {
    // Remove from cart
    cart[country] = cart[country].filter(i => i.id !== id);
    _refreshCardUI(id, country, price, pv);
  } else {
    item.qty = newQty;
    _refreshCardUI(id, country, price, pv);
  }
  updateCartBadges();
  renderCartPanels();
}

// ── Update card DOM in-place (no full re-render) ─────────
function _refreshCardUI(id, country, price, pv) {
  const item = getCartItem(id, country);
  const qty = item ? item.qty : 0;

  const stepperEl = document.getElementById(`stepper-${id}`);
  const addBtnEl  = document.getElementById(`addbtn-${id}`);
  const csnumEl   = document.getElementById(`csnum-${id}`);
  const csubEl    = document.getElementById(`csub-${id}`);

  if (!stepperEl) return; // card not in DOM (grid re-rendered)

  if (qty > 0) {
    stepperEl.classList.add('visible');
    if (addBtnEl) addBtnEl.style.display = 'none';
    if (csnumEl)  csnumEl.textContent = qty;
    if (csubEl) {
      csubEl.classList.add('visible');
      csubEl.textContent = formatPrice(price * qty, country) + (qty > 1 ? ` (×${qty})` : '');
    }
  } else {
    stepperEl.classList.remove('visible');
    if (addBtnEl) addBtnEl.style.display = 'flex';
    if (csnumEl)  csnumEl.textContent = 1;
    if (csubEl) {
      csubEl.classList.remove('visible');
      csubEl.textContent = '';
    }
  }
}

// ── Compare table: first "+ 담기" click ─────────────────
function tblAddFirst(id, country, price, pv) {
  const p = PRODUCTS.find(p => p.id === id);
  cart[country].push({ id, name: p ? p.name_display : id, price, pv, qty: 1 });
  _refreshTableCell(id, country, price, pv);
  updateCartBadges();
  renderCartPanels();
  switchCartTab(country);
}

// ── Compare table: −/+ stepper ──────────────────────────
function tblQty(id, country, price, pv, delta) {
  const item = getCartItem(id, country);
  if (!item) return;
  const newQty = item.qty + delta;
  if (newQty <= 0) {
    cart[country] = cart[country].filter(i => i.id !== id);
  } else {
    item.qty = newQty;
  }
  _refreshTableCell(id, country, price, pv);
  updateCartBadges();
  renderCartPanels();
}

// ── Update table cell stepper in-place ──────────────────
function _refreshTableCell(id, country, price, pv) {
  const cell = document.getElementById(`tcell-${id}`);
  if (!cell) return;
  const item = getCartItem(id, country);
  const qty = item ? item.qty : 0;

  // Replace the control widget (last element of cell)
  const oldCtrl = cell.querySelector('.tbl-stepper, .ts-add-btn');
  if (oldCtrl) oldCtrl.remove();

  const newCtrl = document.createElement('div');
  if (qty > 0) {
    newCtrl.innerHTML = `<div class="tbl-stepper">
      <button class="ts-btn" onclick="tblQty('${id}','${country}',${price},${pv},-1)">−</button>
      <span class="ts-num" id="tsnum-${id}">${qty}</span>
      <button class="ts-btn" onclick="tblQty('${id}','${country}',${price},${pv},1)">+</button>
    </div>`;
  } else {
    newCtrl.innerHTML = `<button class="ts-add-btn" onclick="tblAddFirst('${id}','${country}',${price},${pv})">+ 담기</button>`;
  }
  cell.appendChild(newCtrl.firstElementChild);
}

function changeQty(country, id, delta) {
  const item = cart[country].find(i => i.id === id);
  if (!item) return;
  const newQty = item.qty + delta;
  if (newQty <= 0) {
    // Remove from cart via removeFromCart to sync all UI
    removeFromCart(country, id);
    return;
  }
  item.qty = newQty;
  renderCartPanels();
  updateCartBadges();
  // Sync card stepper & table cell
  _refreshCardUI(id, country, item.price, item.pv);
  const tsnumEl = document.getElementById(`tsnum-${id}`);
  if (tsnumEl) tsnumEl.textContent = newQty;
}

function removeFromCart(country, id) {
  const item = cart[country].find(i => i.id === id);
  const price = item ? item.price : 0;
  const pv    = item ? item.pv    : 0;
  cart[country] = cart[country].filter(i => i.id !== id);
  updateCartBadges();
  renderCartPanels();
  // Refresh card/table UI
  _refreshCardUI(id, country, price, pv);
  _refreshTableCell(id, country, price, pv);
}

function clearCart(country) {
  const snapshot = cart[country].map(i => ({ id: i.id, price: i.price, pv: i.pv }));
  cart[country] = [];
  snapshot.forEach(({ id, price, pv }) => {
    _refreshCardUI(id, country, price, pv);
    _refreshTableCell(id, country, price, pv);
  });
  updateCartBadges();
  renderCartPanels();
}

function updateCartBadges() {
  let total = 0;
  Object.keys(cart).forEach(c => {
    const cnt = cart[c].reduce((s, i) => s + i.qty, 0);
    const el = document.getElementById(`badge-${c}`);
    if (el) el.textContent = cnt;
    total += cnt;
  });
  document.getElementById('total-cart-badge').textContent = `${total} 제품`;
  document.getElementById('float-total').textContent = `${total}개`;

  const totalPV = Object.values(cart).flat().reduce((s, i) => s + i.pv * i.qty, 0);
  document.getElementById('float-pv').textContent = totalPV.toFixed(0);
}

function renderCartPanels() {
  const body = document.getElementById('cart-body');
  const countries = ['KR', 'US', 'JP', 'CN', 'AU'];
  body.innerHTML = countries.map(c => {
    const c_info = CURRENCY[c];
    const items = cart[c];
    const isActive = c === activeCartTab;
    const rateKey = c_info.rate_key;

    const itemsHtml = items.length === 0
      ? '<p style="text-align:center;padding:28px 16px;color:var(--text-muted);font-size:.85rem">담긴 제품이 없습니다</p>'
      : items.map(item => `
        <div class="cart-item">
          <span class="cart-item-name">${escHtml(item.name)}</span>
          <div class="cart-qty-ctrl">
            <button class="qty-btn" onclick="changeQty('${c}','${item.id}',-1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty('${c}','${item.id}',1)">+</button>
          </div>
          <span class="cart-item-price">${formatPrice(item.price * item.qty, c)}</span>
          <button class="cart-item-remove" onclick="removeFromCart('${c}','${item.id}')">✕</button>
        </div>
      `).join('');

    const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
    const totalPV = items.reduce((s, i) => s + i.pv * i.qty, 0);
    const subtotalKRW = toKRW(subtotal, c);

    const totalsHtml = `
      <div class="cart-totals">
        <div class="cart-total-row pv-total">
          <span>총 PV</span><span>${totalPV.toFixed(1)}</span>
        </div>
        <div class="cart-total-row main">
          <span>합계</span>
          <span>${formatPrice(subtotal, c)}</span>
        </div>
        ${c !== 'KR' ? `
        <div class="cart-total-row krw-converted">
          <span>원화 환산</span>
          <span>≈ ₩${subtotalKRW.toLocaleString()}</span>
        </div>` : ''}
      </div>
      ${items.length > 0 ? `<button class="cart-clear-btn" onclick="clearCart('${c}')">🗑 ${c_info.label} 장바구니 비우기</button>` : ''}
    `;

    return `
    <div class="cart-country-panel${isActive ? ' active' : ''}" id="cart-panel-${c}">
      <div class="cart-items">${itemsHtml}</div>
      ${totalsHtml}
    </div>`;
  }).join('');
}

function switchCartTab(country) {
  activeCartTab = country;
  document.querySelectorAll('.cart-country-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cart === country);
  });
  document.querySelectorAll('.cart-country-panel').forEach(p => {
    p.classList.toggle('active', p.id === `cart-panel-${country}`);
  });
}

function setView(view) {
  currentView = view;
  document.getElementById('grid-view').style.display = view === 'grid' ? 'grid' : 'none';
  document.getElementById('compare-view').style.display = view === 'compare' ? 'block' : 'none';
  document.getElementById('btn-grid').classList.toggle('active', view === 'grid');
  document.getElementById('btn-compare').classList.toggle('active', view === 'compare');
  renderAll();
}

function scrollToCart() {
  document.querySelector('.cart-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
